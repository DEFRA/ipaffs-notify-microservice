keda:
  enabled: true
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: "notify-queue"
        connectionFromEnv: SERVICE_BUS_CONNECTION_STRING
        messageCount: "5"
serviceBus:
  enabled: true
  useSecrets: true

container:
  command: /usr/bin/env
  args:
    - NOTIFY_QUEUE_CONNECTION_NAME=$(SERVICE_BUS_CONNECTION_STRING)
    - java
    - -javaagent:/home/app/applicationinsights-agent.jar
    - -cp
    - /home/app/lib/*:/home/app/bin/*:/home/app/app.jar
    - uk.gov.defra.tracesx.notify.KedaJobRunner

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "500m"
    memory: 1Gi
config:
  NOTIFY_QUEUE_NAME: "notify-queue"
  ENABLE_EMAIL_NOTIFICATION: "true"
  ENABLE_TEXT_NOTIFICATION: "true"
  TRADE_PLATFORM_NOTIFY_URL: "https://snd-internal-gateway.trade.azure.defra.cloud/trade-notify/v1"
  TRADE_PLATFORM_SYSTEM_NAME: "IPAFFS"
  TRADE_PLATFORM_SYSTEM_UNIQUE_ID: "38BC514D-FC26-47BF-99C2-6FCACF581AF5"
  API_VERSION: "1.0.0"
  KEDA_MAX_MESSAGES: "100"
  KEDA_RECEIVE_WAIT_SECONDS: "10"
  KEDA_MAX_EMPTY_RECEIVES: "3"
