service: notify-service
container:
  replicas: 1
config:
  JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=60.0"
  API_VERSION: "1.0.0"
  ENABLE_EMAIL_NOTIFICATION: "true"
  ENABLE_TEXT_NOTIFICATION: "true"
  KEDA_MAX_EMPTY_RECEIVES: "3"
  KEDA_MAX_MESSAGES: "100"
  KEDA_RECEIVE_WAIT_SECONDS: "10"
  NOTIFY_QUEUE_NAME: "notify_queue"
  TRADE_PLATFORM_SYSTEM_NAME: "IPAFFS"
  TRADE_PLATFORM_SYSTEM_UNIQUE_ID: "38BC514D-FC26-47BF-99C2-6FCACF581AF5"
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    memory: 4Gi
serviceBus:
  enabled: true
  connectionStringSecretKey: NOTIFY_QUEUE_CONNECTION_NAME
keda:
  enabled: true
  pollingInterval: 30
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: "notify_queue"
        connectionFromEnv: NOTIFY_QUEUE_CONNECTION_NAME
        messageCount: "5"
externalSecret:
  enabled: true
  refreshInterval: 1h
  secrets:
    - secretKey: TRADE_PLATFORM_CLIENT_SECRET
      remoteKey: tradePlatformClientSecret
    - secretKey: TRADE_PLATFORM_SUBSCRIPTION_KEY
      remoteKey: tradePlatformSubscriptionKey
    - secretKey: NOTIFY_QUEUE_CONNECTION_NAME
      remoteKey: serviceBusConnectionString
